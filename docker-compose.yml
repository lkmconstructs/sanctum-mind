# Local quickstart (three commands):
#   docker compose up -d db
#   docker compose run --rm init            # one-shot admin setup; prints the bearer key + MCP configs
#   docker compose up -d mind
# and the background passes (settles cooled identity changes, delivers sinks):  docker compose up -d daemon
#
# Choose the mind with MIND (default alpha):  MIND=beta docker compose run --rm init
# init is idempotent and never rotates an existing key unless you pass --rotate (repeat --docker and the
# other flags when you replace the command, since the command below is replaced as a whole):
#   docker compose run --rm init node dist/cli.js init --mind alpha --docker --public-db-host localhost:5432 --rotate
# The same one-shot also works through the service image:
#   docker compose run --rm -e DATABASE_URL="$ADMIN_DATABASE_URL" mind node dist/cli.js init --mind alpha --docker --public-db-host localhost:5432
# ADMIN_DATABASE_URL defaults to the bundled db's postgres user.
#
# Export and import go through the "tools" service (same image, sanctum_app login, ./exchange mounted at /exchange):
#   mkdir -p exchange                      # must exist and be writable by uid 1000 (the container's "node" user)
#   docker compose run --rm tools node dist/cli.js export-mind --mind alpha --out /exchange/alpha.json
#   docker compose run --rm tools node dist/cli.js import-mind /exchange/alpha.json --mind alpha --dry-run
# It also runs embed-backfill and "sinks requeue --sink <name>". Admin commands stay on the init service.
#
# The passwords below are for local use only. Override POSTGRES_PASSWORD and APP_PASSWORD
# (environment or a .env file next to this one) before exposing anything. Use URL-safe
# characters in them, since they are placed inside connection URLs.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sanctum_local}
      POSTGRES_DB: sanctum_mind
    volumes:
      - sanctum-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sanctum_mind"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot admin setup. Not started by `docker compose up` (profile "init"); run it explicitly.
  init:
    build: .
    image: sanctum-mind:local
    profiles: ["init"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${ADMIN_DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-sanctum_local}@db:5432/sanctum_mind}
      SANCTUM_APP_PASSWORD: ${APP_PASSWORD:-sanctum_app_local}
    # --public-db-host only changes the DATABASE_URL printed in the configs (your machine reaches the
    # database on localhost:5432); init itself connects to db:5432. --docker prints the HTTP and stdio (Docker)
    # configs and leaves out the host-path stdio config, which cannot work on the host.
    command: ["node", "dist/cli.js", "init", "--mind", "${MIND:-alpha}", "--port", "${PORT:-8002}", "--public-db-host", "localhost:5432", "--docker"]

  mind:
    build: .
    image: sanctum-mind:local
    # A fixed name so the stdio (Docker) config can say `docker exec -i ... sanctum-mind node dist/cli.js stdio`
    # without knowing the compose project name. Two stacks on one machine would collide on it: rename it in one
    # of them (and pass --container <name> to init so the printed config matches), or use HTTP only.
    container_name: sanctum-mind
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sanctum_app:${APP_PASSWORD:-sanctum_app_local}@db:5432/sanctum_mind
      PORT: ${PORT:-8002}
      # Inside the container listen on every interface so other containers can reach it; the port is
      # published to the host's loopback only (below).
      HOST: 0.0.0.0
      EMBEDDER: ${EMBEDDER:-local}
      EMBED_CACHE_DIR: /data/embed-cache
      # Cooling period for identity changes in hours (0 for solo use) and the outbox sinks (JSON inline, or a path
      # inside the container). The mind and the daemon must agree, so both receive the same values.
      IDENTITY_COOLING_HOURS: ${IDENTITY_COOLING_HOURS:-24}
      SINKS: ${SINKS:-}
      SINKS_FILE: ${SINKS_FILE:-}
    ports:
      - "127.0.0.1:${PORT:-8002}:${PORT:-8002}"
    volumes:
      - embed-cache:/data/embed-cache
    restart: unless-stopped

  # One-off export, import and maintenance as the sanctum_app login. Not started by `docker compose up`
  # (profile "tools"); name the command, as in the examples at the top. The container runs as
  # "node" (uid 1000), so ./exchange on the host must exist and be writable by that uid. export-mind refuses to
  # overwrite an existing file.
  tools:
    build: .
    image: sanctum-mind:local
    profiles: ["tools"]
    # With no command given this just prints the command list and exits (the image's own default would start the http service).
    command: ["node", "dist/cli.js", "--help"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sanctum_app:${APP_PASSWORD:-sanctum_app_local}@db:5432/sanctum_mind
      EMBEDDER: ${EMBEDDER:-local}
      EMBED_CACHE_DIR: /data/embed-cache
      SINKS: ${SINKS:-}
      SINKS_FILE: ${SINKS_FILE:-}
    volumes:
      - ./exchange:/exchange
      - embed-cache:/data/embed-cache

  # The metabolism passes for every enabled mind (needs the mind created by init first).
  daemon:
    build: .
    image: sanctum-mind:local
    command: ["node", "dist/cli.js", "daemon"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sanctum_app:${APP_PASSWORD:-sanctum_app_local}@db:5432/sanctum_mind
      EMBEDDER: ${EMBEDDER:-local}
      EMBED_CACHE_DIR: /data/embed-cache
      # Cooling period for identity changes in hours (0 for solo use) and the outbox sinks (JSON inline, or a path
      # inside the container). The mind and the daemon must agree, so both receive the same values.
      IDENTITY_COOLING_HOURS: ${IDENTITY_COOLING_HOURS:-24}
      SINKS: ${SINKS:-}
      SINKS_FILE: ${SINKS_FILE:-}
      # The extractor (off until the operator enables it per mind). Only the daemon reads these. RERANKER=local is not available
      # in the image (the optional package is not installed); use none or http.
      EXTRACTOR_TTL_DAYS: ${EXTRACTOR_TTL_DAYS:-14}
      EXTRACTOR_REPROPOSE_DAYS: ${EXTRACTOR_REPROPOSE_DAYS:-60}
      EXTRACTOR_MAX_CANDIDATES: ${EXTRACTOR_MAX_CANDIDATES:-50}
      RERANKER: ${RERANKER:-none}
      RERANK_URL: ${RERANK_URL:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      EXTRACTOR_LOOKBACK_DAYS: ${EXTRACTOR_LOOKBACK_DAYS:-30}
      EXTRACTOR_REPAIR_BUDGET: ${EXTRACTOR_REPAIR_BUDGET:-50}
      DAEMON_TICK_BUDGET_MS: ${DAEMON_TICK_BUDGET_MS:-0}
    volumes:
      - embed-cache:/data/embed-cache
    restart: unless-stopped

volumes:
  sanctum-db:
  embed-cache:
