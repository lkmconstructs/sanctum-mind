# Local quickstart (three commands):
#   docker compose up -d db
#   docker compose run --rm init            # one-shot admin setup; prints the bearer key + MCP configs
#   docker compose up -d mind
# and the background passes (settles cooled identity changes, delivers sinks):  docker compose up -d daemon
#
# Choose the mind with MIND (default alpha):  MIND=beta docker compose run --rm init
# init is idempotent and never rotates an existing key unless you pass --rotate:
#   docker compose run --rm init node dist/cli.js init --mind alpha --rotate
# The same one-shot also works through the service image:
#   docker compose run --rm -e DATABASE_URL="$ADMIN_DATABASE_URL" mind node dist/cli.js init --mind alpha
# ADMIN_DATABASE_URL defaults to the bundled db's postgres user.
#
# The passwords below are for local use only. Override POSTGRES_PASSWORD and APP_PASSWORD
# (environment or a .env file next to this one) before exposing anything. Use URL-safe
# characters in them, since they are placed inside connection URLs.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sanctum_local}
      POSTGRES_DB: sanctum_mind
    volumes:
      - sanctum-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sanctum_mind"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot admin setup. Not started by `docker compose up` (profile "init"); run it explicitly.
  init:
    build: .
    image: sanctum-mind:local
    profiles: ["init"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${ADMIN_DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-sanctum_local}@db:5432/sanctum_mind}
      SANCTUM_APP_PASSWORD: ${APP_PASSWORD:-sanctum_app_local}
    # --public-db-host only changes the DATABASE_URL printed in the configs (your machine reaches the
    # database on localhost:5432); init itself connects to db:5432.
    command: ["node", "dist/cli.js", "init", "--mind", "${MIND:-alpha}", "--port", "${PORT:-8002}", "--public-db-host", "localhost:5432"]

  mind:
    build: .
    image: sanctum-mind:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sanctum_app:${APP_PASSWORD:-sanctum_app_local}@db:5432/sanctum_mind
      PORT: ${PORT:-8002}
      # Inside the container listen on every interface so other containers can reach it; the port is
      # published to the host's loopback only (below).
      HOST: 0.0.0.0
      EMBEDDER: ${EMBEDDER:-local}
      EMBED_CACHE_DIR: /data/embed-cache
      # Cooling period for identity changes in hours (0 for solo use) and the outbox sinks (JSON inline, or a path
      # inside the container). The mind and the daemon must agree, so both receive the same values.
      IDENTITY_COOLING_HOURS: ${IDENTITY_COOLING_HOURS:-24}
      SINKS: ${SINKS:-}
      SINKS_FILE: ${SINKS_FILE:-}
    ports:
      - "127.0.0.1:${PORT:-8002}:${PORT:-8002}"
    volumes:
      - embed-cache:/data/embed-cache
    restart: unless-stopped

  # The metabolism passes for every enabled mind (needs the mind created by init first).
  daemon:
    build: .
    image: sanctum-mind:local
    command: ["node", "dist/cli.js", "daemon"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sanctum_app:${APP_PASSWORD:-sanctum_app_local}@db:5432/sanctum_mind
      EMBEDDER: ${EMBEDDER:-local}
      EMBED_CACHE_DIR: /data/embed-cache
      # Cooling period for identity changes in hours (0 for solo use) and the outbox sinks (JSON inline, or a path
      # inside the container). The mind and the daemon must agree, so both receive the same values.
      IDENTITY_COOLING_HOURS: ${IDENTITY_COOLING_HOURS:-24}
      SINKS: ${SINKS:-}
      SINKS_FILE: ${SINKS_FILE:-}
    volumes:
      - embed-cache:/data/embed-cache
    restart: unless-stopped

volumes:
  sanctum-db:
  embed-cache:
