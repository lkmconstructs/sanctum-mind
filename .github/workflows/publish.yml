# Publishes the package to npm when a GitHub release is published, using npm trusted publishing
# (OpenID Connect): no npm token is stored anywhere. One-time setup on npmjs.com: the package's
# settings, "Trusted publisher", GitHub Actions, this repository, workflow file "publish.yml".
name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npm run typecheck && npm run build
      - run: test "v$(node -p "require('./package.json').version")" = "${{ github.event.release.tag_name }}"
      - run: npm publish --access public --provenance
